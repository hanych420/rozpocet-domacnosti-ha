<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Nákupy · Haneva</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--surface:rgba(255,255,255,.94);--text:#172033;--muted:#6b7280;--line:#e8ebf2;--shadow:0 18px 50px rgba(31,41,55,.10);--radius:24px;--green:#10b981;--red:#ef4444;--amber:#f59e0b}
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 0% 0%,rgba(110,231,183,.22),transparent 30rem),radial-gradient(circle at 100% 0%,rgba(96,165,250,.16),transparent 30rem),var(--bg)}
    button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(880px,calc(100% - 28px));margin:0 auto;padding:22px 0 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font-weight:850}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#111827;color:#fff}.back{color:#596174;text-decoration:none;font-size:14px;font-weight:750}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}.head h1{margin:0 0 6px;font-size:clamp(40px,7vw,62px);line-height:1;letter-spacing:-.05em}.head p{margin:0;color:var(--muted);font-size:15px}.deals-link{white-space:nowrap;text-decoration:none;border-radius:14px;background:#111827;color:#fff;padding:11px 15px;font-size:13px;font-weight:850;box-shadow:0 10px 24px rgba(17,24,39,.14)}
    .panel{background:var(--surface);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(16px);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:20px;letter-spacing:-.025em}.small{font-size:12px;color:#8b93a0}.add{display:grid;grid-template-columns:minmax(0,1fr) 110px 130px auto;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(249,250,251,.72)}.add input,.add select{min-width:0;border:1px solid #dfe3ea;border-radius:12px;padding:10px 11px;background:#fff;color:var(--text);outline:none}.add input:focus,.add select:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.14)}.primary{border:0;border-radius:12px;background:#111827;color:#fff;padding:10px 14px;font-weight:850}.items{padding:6px 0}.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #f0f2f6}.item:last-child{border-bottom:0}.item.done{opacity:.46}.item.done .item-name{text-decoration:line-through}.check{width:22px;height:22px;accent-color:#111827}.item-name{font-weight:850;line-height:1.25}.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800;background:#f3f4f6;color:#667085}.pill.lidl{background:#fff5c2;color:#755400}.pill.albert{background:#dcfce7;color:#166534}.deal-alert{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:850}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(0,0,0,.03)}.dot.upcoming{background:#f59e0b}.dot.ending{background:#ef4444}.dot.expired{background:#9ca3af}.deal-alert.upcoming{color:#b76100}.deal-alert.ending{color:#dc2626}.deal-alert.expired{color:#7b8492}.icon-btn{border:0;background:transparent;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;color:#7b8492;font-size:17px}.icon-btn:hover{background:#f3f4f6;color:#111827}.watch.active{color:#f59e0b}.empty{padding:42px 20px;text-align:center;color:#9aa1ad;line-height:1.55}.list-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:#fbfcfe}.link-button{border:0;background:transparent;color:#697386;font-size:12px;font-weight:750;padding:6px}.link-button.danger{color:#dc2626}.quick{margin:0 16px 14px;box-shadow:none;background:#f8fafc;background:var(--surface);border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:0 12px 32px rgba(31,41,55,.07);padding:15px 16px}.quick-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:10px}.quick-title{font-size:13px;font-weight:900}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;color:#535d6d;transition:.15s}.chip:active{transform:scale(.97)}.chip.added{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.toast{position:fixed;right:18px;bottom:18px;z-index:20;background:#111827;color:#fff;border-radius:13px;padding:11px 14px;font-size:13px;font-weight:700;box-shadow:0 12px 34px rgba(17,24,39,.24);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:650px){.quick{margin:0 10px 12px}.wrap{width:min(100% - 18px,880px);padding-top:14px}.topbar{margin-bottom:20px}.back{font-size:12px}.head{align-items:flex-start}.head h1{font-size:44px}.head p{font-size:14px}.deals-link{padding:10px 12px}.add{grid-template-columns:1fr 90px}.add select{grid-column:1/2}.add button{grid-column:2/3;grid-row:2}.panel{border-radius:20px}.panel-head{padding:15px}.item{padding:11px 12px}.quick{border-radius:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar"><a class="brand" href="/"><span class="brand-mark">H</span><span>Haneva</span></a><a class="back" href="/">← Zpět na přehled</a></div>
    <section class="head">
      <div><h1>Nákupy</h1><p>Společný seznam. Hotové položky si Haneva pamatuje pro rychlé přidání příště.</p></div>
      <a class="deals-link" href="/nakupy/akce">🔥 Projít akce</a>
    </section>

    <section class="panel">
      <div class="panel-head"><div><h2>🛒 Nákupní seznam</h2><div class="small" id="itemSummary">Načítám…</div></div></div>
      <form class="add" id="addForm">
        <input id="itemName" maxlength="160" placeholder="Co koupit?" autocomplete="off" required>
        <input id="itemQty" maxlength="80" placeholder="Množství">
        <select id="itemStore" aria-label="Obchod"><option value="any">Je mi to jedno</option><option value="lidl">Lidl</option><option value="albert">Albert</option></select>
        <button class="primary" type="submit">＋ Přidat</button>
      </form>
      <section class="quick">
            <div class="quick-head"><div class="quick-title">⚡ Často kupujeme</div><div class="small">Klepnutím rovnou přidáš</div></div>
            <div class="chips" id="historyChips"></div>
          </section>
      <div class="items" id="items"></div>
      <div class="list-footer"><span class="small">★ = hlídat v akcích</span><button class="link-button danger" id="clearDone" type="button">Odstranit hotové</button></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const state={items:[],history:[]};
    const $=id=>document.getElementById(id);
    const escapeHtml=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const storeLabel=s=>s==='lidl'?'Lidl':s==='albert'?'Albert':'';
    const norm=(s='')=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
    let toastTimer;
    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
    async function api(url,opts={}){const res=await fetch(url,{cache:'no-store',...opts});const data=await res.json();if(!res.ok)throw new Error(data.error||'Něco se nepodařilo.');return data}
    function activeNames(){return new Set(state.items.filter(i=>!i.checked).map(i=>norm(i.name)))}
    function watchedNorms(){return new Set(state.history.filter(x=>x.watched).map(x=>x.name_norm))}

    async function loadState(){const data=await api('/api/shopping/state');state.items=data.items||[];state.history=data.history||[];renderItems();renderHistory()}
    function renderItems(){
      const box=$('items');box.innerHTML='';const open=state.items.filter(i=>!i.checked).length,done=state.items.length-open;$('itemSummary').textContent=`${open} k nákupu${done?` · ${done} hotovo`:''}`;
      if(!state.items.length){box.innerHTML='<div class="empty">Seznam je prázdný. Přidej první věc, kterou je potřeba koupit.</div>';return}
      const watched=watchedNorms();
      state.items.forEach(item=>{
        const row=document.createElement('div');row.className='item'+(item.checked?' done':'');const store=storeLabel(item.preferred_store);const isWatched=watched.has(norm(item.name));const deal=item.deal||null;
        const alert=deal&&['upcoming','ending','expired'].includes(deal.status)?`<span class="deal-alert ${deal.status}" title="${escapeHtml(deal.message||'')}"><span class="dot ${deal.status}"></span>${escapeHtml(deal.message||'')}</span>`:'';
        const actionPrice=deal&&deal.price?`<span class="pill">akce ${escapeHtml(deal.price)}</span>`:'';
        row.innerHTML=`<input class="check" type="checkbox" ${item.checked?'checked':''} aria-label="Hotovo"><div><div class="item-name">${escapeHtml(item.name)}</div><div class="meta">${item.quantity?`<span class="pill">${escapeHtml(item.quantity)}</span>`:''}${store?`<span class="pill ${item.preferred_store}">${store}</span>`:''}${actionPrice}${alert}</div></div><button class="icon-btn watch ${isWatched?'active':''}" type="button" title="${isWatched?'Přestat hlídat':'Hlídat akce'}">★</button><button class="icon-btn delete" type="button" title="Smazat">×</button>`;
        row.querySelector('.check').addEventListener('change',async e=>{try{await api(`/api/shopping/items/${item.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({checked:e.target.checked})});await loadState()}catch(err){toast(err.message)}});
        row.querySelector('.watch').addEventListener('click',async()=>{try{await api('/api/shopping/watch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:item.name,watched:!isWatched})});await loadState()}catch(err){toast(err.message)}});
        row.querySelector('.delete').addEventListener('click',async()=>{try{await api(`/api/shopping/items/${item.id}`,{method:'DELETE'});await loadState()}catch(err){toast(err.message)}});
        box.appendChild(row);
      });
    }
    function renderHistory(){
      const box=$('historyChips');box.innerHTML='';const active=activeNames();const rows=state.history.slice(0,18);
      if(!rows.length){box.innerHTML='<span class="small">Až něco párkrát koupíte, objeví se to tady.</span>';return}
      rows.forEach(h=>{const b=document.createElement('button');b.type='button';b.className='chip'+(active.has(h.name_norm)?' added':'');b.textContent=(active.has(h.name_norm)?'✓ ':'＋ ')+h.display_name;b.addEventListener('click',async()=>{if(activeNames().has(h.name_norm)){toast('Už je na seznamu.');return}try{await api('/api/shopping/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:h.display_name,preferred_store:'any'})});toast(`Přidáno: ${h.display_name}`);await loadState()}catch(err){toast(err.message)}});box.appendChild(b)});
    }
    $('addForm').addEventListener('submit',async e=>{e.preventDefault();const name=$('itemName').value.trim();if(!name)return;try{await api('/api/shopping/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,quantity:$('itemQty').value.trim(),preferred_store:$('itemStore').value})});$('itemName').value='';$('itemQty').value='';$('itemName').focus();await loadState()}catch(err){toast(err.message)}});
    $('clearDone').addEventListener('click',async()=>{const count=state.items.filter(i=>i.checked).length;if(!count){toast('Nic hotového tu není.');return}try{const data=await api('/api/shopping/clear-completed',{method:'POST'});toast(`Odstraněno: ${data.deleted}`);await loadState()}catch(err){toast(err.message)}});
    loadState().catch(err=>toast(err.message));
  </script>
</body>
</html>
