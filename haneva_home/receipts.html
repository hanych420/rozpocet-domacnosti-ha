<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Účtenky · Haneva</title>
<style>body{margin:0;font-family:Inter,system-ui;background:#f6f7fb;color:#172033}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:22px 0 50px}.top{display:flex;justify-content:space-between;margin-bottom:24px}.brand,.back{color:inherit;text-decoration:none;font-weight:850}.back{font-size:13px;color:#667085}h1{font-size:clamp(42px,8vw,68px);margin:0 0 8px;letter-spacing:-.05em}.lead{color:#707887}.panel{background:#fff;border-radius:22px;padding:16px;box-shadow:0 16px 44px rgba(31,41,55,.08);margin-top:16px}.upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.upload input{position:absolute;width:1px;height:1px;opacity:0}.primary,.secondary{border:0;border-radius:12px;padding:11px 14px;font-weight:850}.primary{background:#111827;color:#fff}.secondary{background:#eef1f5;color:#4b5563}.fields{display:grid;grid-template-columns:1fr 160px 160px;gap:8px;margin:14px 0}.fields input{border:1px solid #dfe3ea;border-radius:10px;padding:10px}.rows{display:flex;flex-direction:column}.row{display:grid;grid-template-columns:1fr 120px 38px;gap:7px;padding:7px 0;border-bottom:1px solid #eceef2}.row input{border:1px solid #dfe3ea;border-radius:9px;padding:8px}.row button{border:0;border-radius:9px}.result{font-size:13px;color:#047857;font-weight:800;margin-top:10px}.history{display:grid;gap:8px}.history-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eceef2;padding:8px 0}.muted{color:#7b8492;font-size:12px}.hidden{display:none!important}@media(max-width:650px){.fields{grid-template-columns:1fr}.row{grid-template-columns:1fr 100px 34px}}</style></head>
<body><main class="wrap"><div class="top"><a class="brand" href="/">Haneva</a><a class="back" href="/nakupy">← Nákupy</a></div><h1>Účtenky</h1><p class="lead">Vyfoť nebo nahraj účtenku. Haneva spáruje položky s nákupním seznamem a uloží ceny.</p>
<section class="panel"><div class="upload"><label class="primary" for="file">📷 Vyfotit / nahrát účtenku</label><input id="file" type="file" accept="image/*,application/pdf" capture="environment"><span class="muted" id="status">PDF nebo fotka, max. 18 MB</span></div>
<div id="editor" class="hidden"><div class="fields"><input id="shop" placeholder="Obchod"><input id="date" type="date"><input id="total" placeholder="Celkem Kč" inputmode="decimal"></div><div class="rows" id="rows"></div><button class="secondary" id="addRow">＋ Položka</button><button class="primary" id="save" style="float:right">Uložit účtenku</button><div style="clear:both"></div><div class="result" id="result"></div></div></section>
<section class="panel"><h2 style="margin-top:0">Historie cen</h2><div class="history" id="prices"></div></section></main>
<script>var $=function(i){return document.getElementById(i)},draft=null;async function api(u,o){o=o||{};o.cache='no-store';var r=await fetch(u,o),d=await r.json();if(!r.ok)throw new Error(d.error||'Chyba');return d}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function addRow(name,price){var row=document.createElement('div');row.className='row';row.innerHTML='<input class="name" value="'+esc(name||'')+'" placeholder="Položka"><input class="price" value="'+(price==null?'':price)+'" placeholder="Cena"><button type="button">×</button>';row.querySelector('button').onclick=function(){row.remove()};$('rows').appendChild(row)}function showDraft(d){draft=d;$('shop').value=d.shop||'';$('date').value=d.purchased_at||'';$('total').value=d.total==null?'':d.total;$('rows').innerHTML='';(d.items||[]).forEach(function(x){addRow(x.name,x.price)});$('editor').classList.remove('hidden')}async function prices(){var d=await api('/api/v1/prices'),b=$('prices');b.innerHTML='';if(!d.items.length){b.innerHTML='<div class="muted">Historie vznikne po prvních účtenkách.</div>';return}d.items.forEach(function(x){var e=document.createElement('div');e.className='history-row';e.innerHTML='<div><strong>'+esc(x.display_name)+'</strong><div class="muted">'+x.purchases+' nákupů · průměr '+Number(x.avg_price).toLocaleString('cs-CZ')+' Kč</div></div><strong>'+Number(x.last_price).toLocaleString('cs-CZ')+' Kč</strong>';b.appendChild(e)})}$('file').onchange=async function(){var f=this.files[0];if(!f)return;$('status').textContent='Čtu účtenku…';try{var r=await fetch('/api/v1/receipts/scan',{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream','X-Filename':encodeURIComponent(f.name)},body:f});var d=await r.json();if(!r.ok)throw new Error(d.error||'Nepodařilo se načíst účtenku.');showDraft(d.receipt);$('status').textContent='Zkontroluj rozpoznané položky a ulož.'}catch(e){$('status').textContent=e.message}};$('addRow').onclick=function(){addRow('','')};$('save').onclick=async function(){var items=[].slice.call(document.querySelectorAll('.row')).map(function(r){return {name:r.querySelector('.name').value.trim(),price:r.querySelector('.price').value.trim()}}).filter(function(x){return x.name});var body=Object.assign({},draft,{shop:$('shop').value,purchased_at:$('date').value,total:$('total').value,items:items});var d=await api('/api/v1/receipts/commit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('result').textContent='Uloženo. Se seznamem spárováno '+d.matched_count+' položek.';prices()};prices();</script></body></html>
