<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Kalendář · Haneva</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--surface:rgba(255,255,255,.92);--text:#172033;--muted:#6b7280;--line:#e8ebf2;--shadow:0 18px 50px rgba(31,41,55,.10);--radius:24px;--hanych:#60a5fa;--hanych-bg:#dbeafe;--eva:#c084fc;--eva-bg:#f3e8ff;--spolecne:#34d399;--spolecne-bg:#d1fae5;--narozeniny:#fb923c;--narozeniny-bg:#ffedd5}
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 0% 0%,rgba(147,197,253,.25),transparent 30rem),radial-gradient(circle at 100% 0%,rgba(216,180,254,.24),transparent 28rem),var(--bg)}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1240px,calc(100% - 28px));margin:0 auto;padding:22px 0 44px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font-weight:800}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#111827;color:#fff}.back{display:inline-flex;align-items:center;gap:8px;color:#596174;text-decoration:none;font-size:14px;font-weight:700}
    .head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.head h1{margin:0 0 5px;font-size:clamp(36px,6vw,62px);line-height:1;letter-spacing:-.05em}.head p{margin:0;color:var(--muted);font-size:16px}.primary{border:0;border-radius:15px;background:#111827;color:#fff;padding:13px 18px;font-weight:800;box-shadow:0 10px 24px rgba(17,24,39,.16);display:inline-flex;align-items:center;gap:8px}
    .upcoming{margin-bottom:18px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:16px 18px;box-shadow:0 12px 34px rgba(31,41,55,.07);backdrop-filter:blur(14px)}.upcoming-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.upcoming-head h2{margin:0;font-size:17px;letter-spacing:-.02em}.upcoming-count{font-size:12px;color:#8a92a0;font-weight:750}.upcoming-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.upcoming-item{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;text-align:left;min-width:0;transition:transform .15s ease,box-shadow .15s ease}.upcoming-item:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(31,41,55,.07)}.upcoming-date{font-size:11px;color:#8a92a0;font-weight:800;text-transform:uppercase;margin-bottom:5px}.upcoming-title{display:block;font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.upcoming-meta{display:flex;align-items:center;gap:6px;color:#737b89;font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}.mini-dot.hanych{background:var(--hanych)}.mini-dot.eva{background:var(--eva)}.mini-dot.spolecne{background:var(--spolecne)}.mini-dot.narozeniny{background:var(--narozeniny)}.upcoming-empty{color:#9aa1ad;font-size:13px;padding:4px 0}.upcoming-more{border:0;background:transparent;color:#596174;font-size:12px;font-weight:800;padding:8px 0 0}
    .panel{background:var(--surface);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(16px);overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.nav{display:flex;align-items:center;gap:9px}.nav button,.view-toggle button{border:1px solid var(--line);background:#fff;color:#3d4656;border-radius:12px;padding:9px 12px;font-weight:750}.nav .icon-btn{width:40px;padding:9px 0}.month-title{min-width:180px;text-align:center;font-size:20px;font-weight:850;letter-spacing:-.02em}.view-toggle{display:flex;gap:5px;background:#f3f4f6;padding:4px;border-radius:13px}.view-toggle button{border:0;background:transparent}.view-toggle button.active{background:#fff;color:#111827;box-shadow:0 2px 8px rgba(31,41,55,.08)}
    .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(249,250,251,.65)}.filter{border:1px solid transparent;border-radius:999px;padding:7px 11px;display:inline-flex;align-items:center;gap:7px;background:#fff;color:#596174;font-size:13px;font-weight:750;opacity:.5}.filter.active{opacity:1;border-color:var(--line)}.filter-dot{width:9px;height:9px;border-radius:50%}.filter-dot.hanych{background:var(--hanych)}.filter-dot.eva{background:var(--eva)}.filter-dot.spolecne{background:var(--spolecne)}.filter-dot.narozeniny{background:var(--narozeniny)}
    .weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}.weekdays div{padding:10px 12px;color:#9aa1ad;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}.day{min-height:128px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px;background:rgba(255,255,255,.55);position:relative}.day:nth-child(7n){border-right:0}.day.other{background:rgba(249,250,251,.6)}.day.other .day-number{color:#c4c8cf}.day.today{background:rgba(239,246,255,.72)}.day-number{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;font-size:13px;font-weight:800;color:#4b5563;margin-bottom:4px}.today .day-number{background:#111827;color:#fff}
    .event{width:100%;border:0;text-align:left;border-radius:8px;padding:5px 7px;margin-top:4px;font-size:12px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#263044}.event.hanych{background:var(--hanych-bg);border-left:3px solid var(--hanych)}.event.eva{background:var(--eva-bg);border-left:3px solid var(--eva)}.event.spolecne{background:var(--spolecne-bg);border-left:3px solid var(--spolecne)}.event.narozeniny{background:var(--narozeniny-bg);border-left:3px solid var(--narozeniny)}.more{border:0;background:transparent;color:#6b7280;padding:4px 2px;font-size:11px;font-weight:750}
    .agenda{padding:8px 18px 18px;display:none}.agenda.active{display:block}.calendar-view.hidden{display:none}.agenda-day{padding:14px 0;border-bottom:1px solid var(--line)}.agenda-day:last-child{border-bottom:0}.agenda-date{font-size:13px;font-weight:850;color:#555e6d;margin-bottom:8px;text-transform:capitalize}.agenda-event{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;border-radius:13px;padding:10px 12px;margin-top:7px;background:#fff;text-align:left;box-shadow:0 4px 12px rgba(31,41,55,.04)}.agenda-bar{width:4px;min-height:38px;border-radius:4px;flex:0 0 auto}.agenda-bar.hanych{background:var(--hanych)}.agenda-bar.eva{background:var(--eva)}.agenda-bar.spolecne{background:var(--spolecne)}.agenda-bar.narozeniny{background:var(--narozeniny)}.agenda-main{min-width:0}.agenda-title{font-weight:800;color:#263044}.agenda-meta{color:#8a92a0;font-size:12px;margin-top:2px}.empty{padding:38px 10px;text-align:center;color:#9aa1ad}
    dialog{border:0;border-radius:24px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100vh - 30px);box-shadow:0 30px 90px rgba(17,24,39,.28)}dialog::backdrop{background:rgba(15,23,42,.38);backdrop-filter:blur(4px)}.modal{padding:24px;overflow:auto;max-height:calc(100vh - 30px)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.modal-head h2{margin:0;font-size:25px;letter-spacing:-.03em}.close{border:0;background:#f3f4f6;width:36px;height:36px;border-radius:11px;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#606979}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe3ea;border-radius:12px;padding:11px 12px;background:#fff;color:#172033;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.15)}.field textarea{min-height:86px;resize:vertical}.checkline{display:flex;align-items:center;gap:8px;padding-top:5px}.checkline input{width:17px;height:17px}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px}.actions-right{display:flex;gap:9px;margin-left:auto}.secondary,.danger{border:1px solid var(--line);background:#fff;color:#4b5563;border-radius:12px;padding:10px 14px;font-weight:800}.danger{color:#dc2626;border-color:#fee2e2;background:#fff7f7;display:none}.save{border:0;background:#111827;color:#fff;border-radius:12px;padding:10px 16px;font-weight:850}.toast{position:fixed;right:18px;bottom:18px;z-index:20;background:#111827;color:#fff;border-radius:13px;padding:11px 14px;font-size:13px;font-weight:700;box-shadow:0 12px 34px rgba(17,24,39,.24);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:960px){.upcoming-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:760px){.wrap{width:min(100% - 18px,1240px);padding-top:14px}.topbar{margin-bottom:22px}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:44px}.primary{width:100%;justify-content:center}.upcoming{padding:14px}.upcoming-list{grid-template-columns:1fr}.toolbar{padding:13px}.nav{width:100%;justify-content:space-between}.month-title{min-width:0;flex:1;font-size:18px}.view-toggle{width:100%}.view-toggle button{flex:1}.filters{padding:11px 13px;overflow-x:auto;flex-wrap:nowrap}.filter{flex:0 0 auto}.calendar-view{display:none}.agenda{display:block;padding:4px 13px 14px}.view-toggle .month-button{display:none}.view-toggle .agenda-button{background:#fff;color:#111827;box-shadow:0 2px 8px rgba(31,41,55,.08)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:18px}.actions{align-items:stretch;flex-direction:column}.danger{width:100%}.actions-right{width:100%;margin-left:0}.actions-right button{flex:1}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar"><a class="brand" href="/"><span class="brand-mark">H</span><span>Haneva</span></a><a class="back" href="/">← Zpět na přehled</a></div>
    <section class="head"><div><h1>Kalendář</h1><p>Co čeká Hanycha, Evu a nás oba.</p></div><button class="primary" id="newEvent">＋ Přidat událost</button></section>

    <section class="upcoming" aria-label="Nejbližší události v měsíci">
      <div class="upcoming-head"><h2 id="upcomingTitle">Nejbližší v měsíci</h2><span class="upcoming-count" id="upcomingCount"></span></div>
      <div class="upcoming-list" id="upcomingList"></div>
      <button class="upcoming-more" id="upcomingMore" type="button" hidden></button>
    </section>

    <section class="panel">
      <div class="toolbar"><div class="nav"><button class="icon-btn" id="prevMonth">←</button><button id="todayButton">Dnes</button><div class="month-title" id="monthTitle"></div><button class="icon-btn" id="nextMonth">→</button></div><div class="view-toggle"><button class="month-button active" data-view="month">Měsíc</button><button class="agenda-button" data-view="agenda">Agenda</button></div></div>
      <div class="filters" id="filters"><button class="filter active" data-calendar="hanych"><span class="filter-dot hanych"></span>Hanych</button><button class="filter active" data-calendar="eva"><span class="filter-dot eva"></span>Eva</button><button class="filter active" data-calendar="spolecne"><span class="filter-dot spolecne"></span>Společné</button><button class="filter active" data-calendar="narozeniny"><span class="filter-dot narozeniny"></span>Narozeniny</button></div>
      <div class="calendar-view" id="calendarView"><div class="weekdays"><div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div></div><div class="calendar-grid" id="calendarGrid"></div></div>
      <div class="agenda" id="agenda"></div>
    </section>
  </main>

  <dialog id="eventDialog"><form class="modal" id="eventForm"><div class="modal-head"><h2 id="modalTitle">Nová událost</h2><button class="close" type="button" id="closeDialog">×</button></div><div class="form-grid">
    <div class="field full"><label for="title">Název</label><input id="title" required maxlength="200" placeholder="Např. koncert, návštěva, zubař…"></div>
    <div class="field"><label for="calendar">Kalendář</label><select id="calendar"><option value="hanych">Hanych</option><option value="eva">Eva</option><option value="spolecne" selected>Společné</option><option value="narozeniny">Narozeniny</option></select></div>
    <div class="field"><label for="recurrence">Opakování</label><select id="recurrence"><option value="none">Neopakovat</option><option value="yearly">Každý rok</option></select></div>
    <div class="field"><label for="startDate">Od</label><input id="startDate" type="date" required></div><div class="field"><label for="endDate">Do</label><input id="endDate" type="date" required></div>
    <div class="field full"><label class="checkline"><input id="allDay" type="checkbox" checked> Celý den</label></div><div class="field time-field"><label for="startTime">Čas od</label><input id="startTime" type="time"></div><div class="field time-field"><label for="endTime">Čas do</label><input id="endTime" type="time"></div>
    <div class="field full"><label for="location">Místo</label><input id="location" maxlength="250" placeholder="Volitelné"></div><div class="field full"><label for="notes">Poznámka</label><textarea id="notes" maxlength="2000" placeholder="Volitelné"></textarea></div>
  </div><div class="actions"><button class="danger" type="button" id="deleteEvent">Smazat událost</button><div class="actions-right"><button class="secondary" type="button" id="cancelDialog">Zrušit</button><button class="save" type="submit">Uložit</button></div></div></form></dialog>
  <div class="toast" id="toast"></div>

  <script>
    const months=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
    const calendarNames={hanych:'Hanych',eva:'Eva',spolecne:'Společné',narozeniny:'Narozeniny'};
    const state={cursor:new Date(new Date().getFullYear(),new Date().getMonth(),1),events:[],filters:new Set(['hanych','eva','spolecne','narozeniny']),view:window.innerWidth<=760?'agenda':'month',editingId:null,autoBirthdayRecurrence:false};
    const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),isoLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parseIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(),escapeHtml=(s='')=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),visibleEvents=()=>state.events.filter(e=>state.filters.has(e.calendar));

    function monthBounds(){const first=new Date(state.cursor.getFullYear(),state.cursor.getMonth(),1),last=new Date(state.cursor.getFullYear(),state.cursor.getMonth()+1,0),off=(first.getDay()+6)%7,start=new Date(first);start.setDate(first.getDate()-off);const end=new Date(start);end.setDate(start.getDate()+41);return{first,last,start,end}}
    async function loadEvents(){const{start,end}=monthBounds(),res=await fetch(`/api/events?start=${isoLocal(start)}&end=${isoLocal(end)}`,{cache:'no-store'}),data=await res.json();if(!res.ok)throw new Error(data.error||'Události se nepodařilo načíst.');state.events=data.events||[];render()}
    function render(){$('monthTitle').textContent=`${months[state.cursor.getMonth()]} ${state.cursor.getFullYear()}`;renderUpcoming();renderGrid();renderAgenda();document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$('calendarView').classList.toggle('hidden',state.view!=='month');$('agenda').classList.toggle('active',state.view==='agenda')}
    function eventsForDay(date){const key=isoLocal(date);return visibleEvents().filter(e=>e.start_date<=key&&e.end_date>=key)}
    function eventLabel(e){const prefix=e.all_day||!e.start_time?'':`${e.start_time} `,repeat=e.recurrence==='yearly'?' ↻':'';return`${prefix}${e.title}${repeat}`}

    function upcomingForMonth(){const{first,last}=monthBounds(),today=new Date();today.setHours(0,0,0,0);let from=first;if(today>=first&&today<=last)from=today;const fromKey=isoLocal(from),lastKey=isoLocal(last);return visibleEvents().filter(e=>e.end_date>=fromKey&&e.start_date<=lastKey).sort((a,b)=>`${a.start_date} ${a.start_time||''}`.localeCompare(`${b.start_date} ${b.start_time||''}`))}
    function renderUpcoming(){const events=upcomingForMonth(),list=$('upcomingList'),more=$('upcomingMore');$('upcomingTitle').textContent=`Nejbližší v ${months[state.cursor.getMonth()]}`;$('upcomingCount').textContent=events.length?`${events.length} událostí`:'';list.innerHTML='';if(!events.length){list.innerHTML='<div class="upcoming-empty">V tomto měsíci už nic dalšího není.</div>';more.hidden=true;return}events.slice(0,4).forEach(e=>{const btn=document.createElement('button');btn.type='button';btn.className='upcoming-item';const d=parseIso(e.start_date),dateText=new Intl.DateTimeFormat('cs-CZ',{weekday:'short',day:'numeric',month:'numeric'}).format(d),time=e.all_day?'Celý den':(e.start_time||''),location=e.location?` · ${e.location}`:'';btn.innerHTML=`<div class="upcoming-date">${escapeHtml(dateText)}</div><span class="upcoming-title">${escapeHtml(e.title)}</span><div class="upcoming-meta"><span class="mini-dot ${e.calendar}"></span><span>${escapeHtml(calendarNames[e.calendar])}${time?` · ${escapeHtml(time)}`:''}${escapeHtml(location)}</span></div>`;btn.addEventListener('click',()=>openEdit(e));list.appendChild(btn)});const rest=events.length-4;if(rest>0){more.hidden=false;more.textContent=`+ ${rest} dalších · zobrazit v agendě →`}else more.hidden=true}

    function renderGrid(){const grid=$('calendarGrid');grid.innerHTML='';const{start}=monthBounds(),today=new Date();for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const cell=document.createElement('div');cell.className='day';if(d.getMonth()!==state.cursor.getMonth())cell.classList.add('other');if(sameDay(d,today))cell.classList.add('today');const number=document.createElement('button');number.type='button';number.className='day-number';number.textContent=d.getDate();number.style.border='0';number.style.background=sameDay(d,today)?'#111827':'transparent';number.addEventListener('click',()=>openNew(isoLocal(d)));cell.appendChild(number);const dayEvents=eventsForDay(d);dayEvents.slice(0,3).forEach(e=>{const btn=document.createElement('button');btn.type='button';btn.className=`event ${e.calendar}`;btn.textContent=eventLabel(e);btn.title=`${calendarNames[e.calendar]} · ${e.title}`;btn.addEventListener('click',()=>openEdit(e));cell.appendChild(btn)});if(dayEvents.length>3){const more=document.createElement('button');more.type='button';more.className='more';more.textContent=`+ ${dayEvents.length-3} další`;more.addEventListener('click',()=>{state.view='agenda';render()});cell.appendChild(more)}cell.addEventListener('dblclick',ev=>{if(ev.target.closest('.event'))return;openNew(isoLocal(d))});grid.appendChild(cell)}}
    function renderAgenda(){const box=$('agenda');box.innerHTML='';const events=visibleEvents().filter(e=>{const d=parseIso(e.start_date);return d.getFullYear()===state.cursor.getFullYear()&&d.getMonth()===state.cursor.getMonth()});if(!events.length){box.innerHTML='<div class="empty">V tomto měsíci zatím nic není. Klikni na „Přidat událost“.</div>';return}const grouped={};events.forEach(e=>(grouped[e.start_date]||=[]).push(e));Object.keys(grouped).sort().forEach(day=>{const d=parseIso(day),section=document.createElement('section');section.className='agenda-day';const label=document.createElement('div');label.className='agenda-date';label.textContent=new Intl.DateTimeFormat('cs-CZ',{weekday:'long',day:'numeric',month:'long'}).format(d);section.appendChild(label);grouped[day].forEach(e=>{const btn=document.createElement('button');btn.type='button';btn.className='agenda-event';const time=e.all_day?'Celý den':[e.start_time,e.end_time].filter(Boolean).join('–'),loc=e.location?` · ${e.location}`:'';btn.innerHTML=`<span class="agenda-bar ${e.calendar}"></span><span class="agenda-main"><span class="agenda-title">${escapeHtml(e.title)}</span><span class="agenda-meta">${escapeHtml(time+loc)}${e.recurrence==='yearly'?' · každý rok':''}</span></span>`;btn.addEventListener('click',()=>openEdit(e));section.appendChild(btn)});box.appendChild(section)})}

    function syncTimeFields(){const disabled=$('allDay').checked;document.querySelectorAll('.time-field input').forEach(i=>i.disabled=disabled);document.querySelectorAll('.time-field').forEach(el=>el.style.opacity=disabled?'.45':'1')}
    function resetForm(){$('eventForm').reset();$('calendar').value='spolecne';$('recurrence').value='none';$('allDay').checked=true;$('deleteEvent').style.display='none';state.editingId=null;state.autoBirthdayRecurrence=false;syncTimeFields()}
    function openNew(dateString=null){resetForm();$('modalTitle').textContent='Nová událost';const d=dateString||isoLocal(new Date());$('startDate').value=d;$('endDate').value=d;$('eventDialog').showModal();setTimeout(()=>$('title').focus(),30)}
    async function openEdit(event){state.editingId=event.id;state.autoBirthdayRecurrence=false;const res=await fetch(`/api/events/${event.id}`,{cache:'no-store'}),data=await res.json();if(!res.ok){toast(data.error||'Událost se nepodařilo otevřít.');return}const e=data.event;$('modalTitle').textContent='Upravit událost';$('title').value=e.title||'';$('calendar').value=e.calendar;$('recurrence').value=e.recurrence||'none';$('startDate').value=e.start_date;$('endDate').value=e.end_date;$('allDay').checked=!!e.all_day;$('startTime').value=e.start_time||'';$('endTime').value=e.end_time||'';$('location').value=e.location||'';$('notes').value=e.notes||'';$('deleteEvent').style.display='inline-block';syncTimeFields();$('eventDialog').showModal()}
    function closeDialog(){$('eventDialog').close()}
    async function saveEvent(ev){ev.preventDefault();const payload={title:$('title').value.trim(),calendar:$('calendar').value,recurrence:$('recurrence').value,start_date:$('startDate').value,end_date:$('endDate').value||$('startDate').value,all_day:$('allDay').checked,start_time:$('startTime').value,end_time:$('endTime').value,location:$('location').value.trim(),notes:$('notes').value.trim()},url=state.editingId?`/api/events/${state.editingId}`:'/api/events',method=state.editingId?'PUT':'POST',res=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await res.json();if(!res.ok){toast(data.error||'Událost se nepodařilo uložit.');return}const edited=!!state.editingId;closeDialog();toast(edited?'Událost upravena.':'Událost přidána.');await loadEvents()}
    async function deleteEvent(){if(!state.editingId)return;if(!confirm('Opravdu tuto událost smazat?'))return;const res=await fetch(`/api/events/${state.editingId}`,{method:'DELETE'}),data=await res.json();if(!res.ok){toast(data.error||'Událost se nepodařilo smazat.');return}closeDialog();toast('Událost smazána.');await loadEvents()}
    let toastTimer;function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}

    $('newEvent').addEventListener('click',()=>openNew());
    $('prevMonth').addEventListener('click',()=>{state.cursor.setMonth(state.cursor.getMonth()-1);loadEvents()});
    $('nextMonth').addEventListener('click',()=>{state.cursor.setMonth(state.cursor.getMonth()+1);loadEvents()});
    $('todayButton').addEventListener('click',()=>{const n=new Date();state.cursor=new Date(n.getFullYear(),n.getMonth(),1);loadEvents()});
    $('filters').addEventListener('click',e=>{const btn=e.target.closest('.filter');if(!btn)return;const key=btn.dataset.calendar;state.filters.has(key)?state.filters.delete(key):state.filters.add(key);btn.classList.toggle('active',state.filters.has(key));render()});
    document.querySelector('.view-toggle').addEventListener('click',e=>{const btn=e.target.closest('button[data-view]');if(!btn)return;state.view=btn.dataset.view;render()});
    $('upcomingMore').addEventListener('click',()=>{state.view='agenda';render();document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'})});
    $('allDay').addEventListener('change',syncTimeFields);
    $('eventForm').addEventListener('submit',saveEvent);
    $('deleteEvent').addEventListener('click',deleteEvent);
    $('closeDialog').addEventListener('click',closeDialog);
    $('cancelDialog').addEventListener('click',closeDialog);
    $('eventDialog').addEventListener('click',e=>{if(e.target===$('eventDialog'))closeDialog()});
    $('calendar').addEventListener('change',()=>{const isBirthday=$('calendar').value==='narozeniny';if(isBirthday&&$('recurrence').value==='none'){ $('recurrence').value='yearly';state.autoBirthdayRecurrence=true }else if(!isBirthday&&state.autoBirthdayRecurrence&&$('recurrence').value==='yearly'){ $('recurrence').value='none';state.autoBirthdayRecurrence=false }});
    $('recurrence').addEventListener('change',()=>{state.autoBirthdayRecurrence=false});
    syncTimeFields();loadEvents().catch(err=>toast(err.message));
  </script>
</body>
</html>
