<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Wishlist · Haneva</title><style>
:root{color-scheme:light;--bg:#f6f7fb;--surface:#fff;--text:#172033;--muted:#6b7280;--line:#e8ebf2;--shadow:0 18px 50px rgba(31,41,55,.10);--pink:#ec4899}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,rgba(251,207,232,.55),transparent 30rem),var(--bg)}button,input,textarea,select{font:inherit}.wrap{width:min(100% - 28px,920px);margin:auto;padding:22px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;color:#111827;text-decoration:none}.mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#111827;color:#fff}.back{font-size:13px;color:#697386;font-weight:750;text-decoration:none}.hero{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}.hero h1{font-size:clamp(40px,8vw,68px);letter-spacing:-.055em;line-height:.95;margin:0}.hero p{color:var(--muted);line-height:1.5;margin:9px 0 0;max-width:480px}.btn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 13px;font-weight:800;color:#374151;cursor:pointer}.btn.primary{background:#111827;border-color:#111827;color:#fff}.filters{display:flex;gap:7px;overflow:auto;margin:0 0 14px;padding:2px}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:12px;font-weight:800;color:#657080}.filter.active{background:#111827;color:#fff;border-color:#111827}.list{display:grid;gap:10px}.item{background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(31,41,55,.07);border-radius:20px;padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.item.bought{opacity:.62}.title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.item h3{margin:0;font-size:18px}.price{font-size:17px;font-weight:900}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.pill{padding:5px 8px;background:#f3f4f6;border-radius:999px;font-size:11px;font-weight:750;color:#586273}.p1{background:#fee2e2;color:#b91c1c}.p2{background:#fef3c7;color:#92400e}.p3{background:#e5e7eb;color:#4b5563}.tools{display:flex;gap:5px;align-items:center}.icon{width:36px;height:36px;border:0;background:#f3f4f6;border-radius:11px;font-size:16px;cursor:pointer}.empty{text-align:center;color:#8b94a2;padding:55px 20px;background:#fff;border-radius:22px;border:1px solid var(--line)}dialog{border:0;border-radius:24px;padding:0;width:min(94vw,560px);box-shadow:0 26px 80px rgba(17,24,39,.3)}dialog::backdrop{background:rgba(17,24,39,.45);backdrop-filter:blur(3px)}.dialog{padding:20px}.dialog h2{margin:0 0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields .wide{grid-column:1/-1}.fields input,.fields textarea,.fields select{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff}.fields textarea{min-height:85px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);opacity:0;transition:.2s;background:#111827;color:#fff;padding:11px 15px;border-radius:13px;font-weight:750;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.wrap{width:min(100% - 18px,920px);padding-top:14px}.hero{align-items:flex-start;flex-direction:column}.item{grid-template-columns:1fr}.tools{justify-content:flex-end}.fields{grid-template-columns:1fr}.fields .wide{grid-column:auto}}</style></head><body>
<main class="wrap"><div class="top"><a class="brand" href="/"><span class="mark">H</span>Haneva</a><a class="back" href="/">← Přehled</a></div><section class="hero"><div><h1>Wishlist</h1><p>Věci, které chceme domů, pro sebe nebo společně. Cena, priorita a odkaz na jednom místě.</p></div><button class="btn primary" id="addBtn">＋ Přidat přání</button></section><div class="filters"><button class="filter active" data-filter="wanted">Chceme</button><button class="filter" data-filter="all">Všechno</button><button class="filter" data-filter="hanych">Hanych</button><button class="filter" data-filter="eva">Eva</button><button class="filter" data-filter="spolecne">Společné</button><button class="filter" data-filter="bought">Koupené</button></div><section class="list" id="list"><div class="empty">Načítám wishlist…</div></section></main>
<dialog id="dialog"><form method="dialog" class="dialog" id="form"><h2 id="dialogTitle">Nové přání</h2><div class="fields"><input class="wide" id="title" maxlength="180" placeholder="Co chceme?" required><input id="price" inputmode="decimal" placeholder="Cena Kč"><select id="person"><option value="spolecne">Společné</option><option value="hanych">Hanych</option><option value="eva">Eva</option></select><select id="priority"><option value="1">Priorita: vysoká</option><option value="2" selected>Priorita: normální</option><option value="3">Priorita: někdy</option></select><input id="url" class="wide" type="url" placeholder="Odkaz (volitelné)"><textarea id="notes" class="wide" placeholder="Poznámka"></textarea></div><div class="actions"><button class="btn" value="cancel">Zrušit</button><button class="btn primary" value="save">Uložit</button></div></form></dialog><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),state={items:[],filter:"wanted",editing:null};const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));let timer;
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(timer);timer=setTimeout(()=>$("toast").classList.remove("show"),2000)}
async function api(url,opts={}){const r=await fetch(url,{cache:"no-store",...opts}),d=await r.json();if(!r.ok)throw new Error(d.error||"Něco se nepodařilo.");return d}
function labelPerson(p){return p==="hanych"?"Hanych":p==="eva"?"Eva":"Společné"}function priorityText(p){return p===1?"Vysoká":p===3?"Někdy":"Normální"}function money(v){return v==null?"":new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"CZK",maximumFractionDigits:0}).format(v)}
function visible(i){if(state.filter==="all")return true;if(state.filter==="wanted")return i.status==="wanted";if(state.filter==="bought")return i.status==="bought";return i.person===state.filter&&i.status==="wanted"}
function render(){const box=$("list");box.innerHTML="";const rows=state.items.filter(visible);if(!rows.length){box.innerHTML='<div class="empty">Tady zatím nic není.</div>';return}rows.forEach(i=>{const el=document.createElement("article");el.className="item "+(i.status==="bought"?"bought":"");let link=i.url?'<a class="icon" style="display:grid;place-items:center;text-decoration:none" target="_blank" rel="noopener" href="'+esc(i.url)+'">↗</a>':"";el.innerHTML='<div><div class="title-row"><h3>'+esc(i.title)+'</h3>'+(i.price!=null?'<span class="price">'+money(i.price)+"</span>":"")+'</div><div class="meta"><span class="pill">'+labelPerson(i.person)+'</span><span class="pill p'+i.priority+'">'+priorityText(i.priority)+'</span>'+(i.notes?'<span class="pill">'+esc(i.notes)+"</span>":"")+"</div></div><div class=\"tools\">"+link+'<button class="icon" data-status title="'+(i.status==="bought"?"Vrátit mezi přání":"Označit koupené")+'">'+(i.status==="bought"?"↩":"✓")+'</button><button class="icon" data-edit>✎</button><button class="icon" data-delete>×</button></div>';el.querySelector("[data-status]").onclick=()=>setStatus(i,i.status==="bought"?"wanted":"bought");el.querySelector("[data-edit]").onclick=()=>openEdit(i);el.querySelector("[data-delete]").onclick=()=>remove(i);box.appendChild(el)})}
async function load(){const d=await api("/api/v1/wishlist");state.items=d.items||[];render()}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
function clearForm(){$("form").reset();$("priority").value="2";$("person").value="spolecne";state.editing=null;$("dialogTitle").textContent="Nové přání"}
$("addBtn").onclick=()=>{clearForm();$("dialog").showModal()};
function openEdit(i){state.editing=i;$("dialogTitle").textContent="Upravit přání";$("title").value=i.title;$("price").value=i.price==null?"":String(i.price).replace(".",",");$("person").value=i.person;$("priority").value=i.priority;$("url").value=i.url||"";$("notes").value=i.notes||"";$("dialog").showModal()}
$("form").addEventListener("submit",async e=>{if(e.submitter&&e.submitter.value==="cancel")return;e.preventDefault();const body={title:$("title").value,price:$("price").value,person:$("person").value,priority:Number($("priority").value),url:$("url").value,notes:$("notes").value,status:state.editing?state.editing.status:"wanted"};try{const url=state.editing?"/api/v1/wishlist/"+state.editing.id:"/api/v1/wishlist";await api(url,{method:state.editing?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});$("dialog").close();await load();toast("Uloženo")}catch(err){toast(err.message)}});
async function setStatus(i,status){try{await api("/api/v1/wishlist/"+i.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({...i,status})});await load()}catch(e){toast(e.message)}}
async function remove(i){if(!confirm("Smazat "+i.title+"?"))return;try{await api("/api/v1/wishlist/"+i.id,{method:"DELETE"});await load()}catch(e){toast(e.message)}}
load().catch(e=>toast(e.message));
</script></body></html>
