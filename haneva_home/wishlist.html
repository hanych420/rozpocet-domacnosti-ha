<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist · Haneva</title>
<style>body{margin:0;font-family:Inter,system-ui;background:#f6f7fb;color:#172033}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:22px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;color:inherit;text-decoration:none}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#111827;color:#fff;box-shadow:0 10px 24px rgba(17,24,39,.18)}.back{font-size:13px;color:#667085;text-decoration:none}.hub-nav{display:flex;gap:5px;background:#e9edf3;padding:5px;border-radius:14px;margin-bottom:16px;overflow:auto}.hub-nav a{flex:1;min-width:90px;text-align:center;text-decoration:none;color:#667085;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:850;white-space:nowrap}.hub-nav a.active{background:#fff;color:#111827;box-shadow:0 2px 8px rgba(31,41,55,.08)}h1{font-size:clamp(42px,8vw,68px);margin:0 0 8px;letter-spacing:-.05em}.lead{color:#707887;margin:0 0 22px}.panel{background:#fff;border-radius:22px;padding:16px;box-shadow:0 16px 44px rgba(31,41,55,.08)}form{display:grid;grid-template-columns:1fr 130px 120px auto;gap:8px;margin-bottom:14px}input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid #dfe3ea;border-radius:11px;padding:10px;background:#fff}.primary{border:0;border-radius:11px;background:#111827;color:#fff;padding:10px 14px;font-weight:850}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid #e8eaf0;border-radius:16px;padding:14px;background:#fff}.item h3{margin:0 0 5px}.meta{font-size:12px;color:#7b8492}.actions{display:flex;gap:7px;margin-top:12px}.actions button,.actions a{border:1px solid #e8eaf0;background:#fff;color:#4b5563;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800;text-decoration:none}.bought{opacity:.5}.empty{padding:30px;text-align:center;color:#9299a5}@media(max-width:650px){form{grid-template-columns:1fr 1fr}.items{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><div class="top"><a class="brand" href="/" aria-label="Haneva domů"><span class="brand-mark">H</span><span>Haneva</span></a><a class="back" href="/">← Přehled</a></div><nav class="hub-nav" aria-label="Nákupy a jídlo"><a href="/nakupy">Seznam</a><a href="/nakupy/akce">Akce</a><a href="/jidlo">Recepty</a><a class="active" href="/wishlist">Wishlist</a></nav><h1>Wishlist</h1><p class="lead">Věci, které si chceme pořídit. Teď už přímo v Hanevě.</p>
<section class="panel"><form id="form"><input id="title" placeholder="Co chceme?" required maxlength="200"><input id="price" placeholder="Cena Kč" inputmode="decimal"><select id="priority"><option value="1">Vysoká priorita</option><option value="2" selected>Normální</option><option value="3">Někdy</option></select><button class="primary">＋ Přidat</button><input id="url" style="grid-column:1/-1" placeholder="Odkaz (volitelně)"></form><div class="items" id="items"></div></section></main>
<script>var $=function(i){return document.getElementById(i)};async function api(u,o){o=o||{};o.cache='no-store';var r=await fetch(u,o),d=await r.json();if(!r.ok)throw new Error(d.error||'Chyba');return d}function money(v){return v==null?'':new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',maximumFractionDigits:0}).format(v)}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}async function load(){var d=await api('/api/v1/wishlist'),b=$('items');b.innerHTML='';if(!d.items.length){b.innerHTML='<div class="empty">Wishlist je zatím prázdný.</div>';return}d.items.forEach(function(x){var e=document.createElement('article');e.className='item '+(x.status==='bought'?'bought':'');e.innerHTML='<h3>'+esc(x.title)+'</h3><div class="meta">'+money(x.price)+(x.priority===1?' · vysoká priorita':x.priority===3?' · někdy':'')+'</div><div class="actions">'+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">Otevřít</a>':'')+'<button data-a="done">'+(x.status==='bought'?'Vrátit':'Koupeno')+'</button><button data-a="del">Smazat</button></div>';e.querySelector('[data-a=done]').onclick=async function(){await api('/api/v1/wishlist/'+x.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:x.title,url:x.url,price:x.price,priority:x.priority,notes:x.notes,status:x.status==='bought'?'wanted':'bought'})});load()};e.querySelector('[data-a=del]').onclick=async function(){await api('/api/v1/wishlist/'+x.id,{method:'DELETE'});load()};b.appendChild(e)})}$('form').onsubmit=async function(e){e.preventDefault();await api('/api/v1/wishlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value,price:$('price').value,priority:$('priority').value,url:$('url').value})});e.target.reset();$('priority').value='2';load()};load();</script></body></html>
