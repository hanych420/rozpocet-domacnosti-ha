<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práce · Haneva</title>
<style>body{margin:0;font-family:Inter,system-ui;background:#f6f7fb;color:#172033}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:22px 0 50px}.top{display:flex;justify-content:space-between;margin-bottom:24px}.brand,.back{color:inherit;text-decoration:none;font-weight:850}.back{font-size:13px;color:#667085}h1{font-size:clamp(42px,8vw,68px);margin:0 0 8px;letter-spacing:-.05em}.lead{color:#707887}.panel{background:#fff;border-radius:22px;padding:16px;box-shadow:0 16px 44px rgba(31,41,55,.08);margin-top:16px}.upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.upload input{position:absolute;width:1px;height:1px;opacity:0}.paste-zone{margin-top:12px;border:1.5px dashed #cbd5e1;border-radius:14px;padding:14px;text-align:center;background:#f8fafc;color:#64748b;font-size:13px;font-weight:750;transition:.15s}.paste-zone.active{border-color:#111827;background:#eef2ff;color:#111827}.primary,.secondary{border:0;border-radius:12px;padding:11px 14px;font-weight:850}.primary{background:#111827;color:white}.secondary{background:#eef1f5;color:#4b5563}.rows{margin-top:14px;display:flex;flex-direction:column;gap:7px}.row{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center;border:1px solid #e8eaf0;border-radius:13px;padding:9px}.row input,.row select{border:1px solid #dfe3ea;border-radius:9px;padding:8px}.muted{font-size:12px;color:#7b8492}.saved{display:flex;gap:9px;flex-wrap:wrap}.chip{padding:8px 10px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:800}.hidden{display:none!important}@media(max-width:620px){.row{grid-template-columns:1fr 1fr}.row button{grid-column:1/-1}}</style></head>
<body><main class="wrap"><div class="top"><a class="brand" href="/">Haneva</a><a class="back" href="/kalendar">← Kalendář</a></div><h1>Práce</h1><p class="lead">Nahraj screenshot směn. Haneva hledá „Jan Vaněk“, připraví náhled a až pak směny uloží.</p>
<section class="panel"><div class="upload"><label class="primary" for="file">📷 Nahrát screenshot směn</label><input id="file" type="file" accept="image/*,application/pdf"><span class="muted" id="status">JPG, PNG, WebP nebo PDF</span></div><div class="paste-zone" id="pasteZone">Nebo udělej screenshot a stiskni <strong>Ctrl + V</strong> kdekoliv na této stránce.</div><div id="preview" class="hidden"><div class="rows" id="rows"></div><button class="primary" id="save" style="margin-top:12px">Přidat do kalendáře práce</button></div></section>
<section class="panel"><h2 style="margin-top:0">Uložené směny</h2><div class="saved" id="saved"></div></section></main>
<script>var $=function(i){return document.getElementById(i)},draft=[];
async function scanFile(f){
  if(!f)return;
  $('status').textContent='Čtu screenshot…';
  $('pasteZone').classList.add('active');
  try{
    var r=await fetch('/api/v1/work/scan',{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream','X-Filename':encodeURIComponent(f.name||'screenshot.png')},body:f});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||'Nepodařilo se načíst směny.');
    draft=d.shifts||[];
    $('status').textContent=draft.length?'Zkontroluj rozpoznané směny.':'Jan Vaněk nebyl s datem a typem směny bezpečně rozpoznán.';
    renderPreview();
  }catch(e){
    $('status').textContent=e.message;
  }finally{
    $('pasteZone').classList.remove('active');
  }
}
async function api(u,o){o=o||{};o.cache='no-store';var r=await fetch(u,o),d=await r.json();if(!r.ok)throw new Error(d.error||'Chyba');return d}function rowHtml(x,i){return '<div class="row" data-i="'+i+'"><input class="date" type="date" value="'+(x.date||'')+'"><select class="shift"><option value="dopoledni" '+(x.shift==='dopoledni'?'selected':'')+'>Dopolední</option><option value="odpoledni" '+(x.shift==='odpoledni'?'selected':'')+'>Odpolední</option></select><button class="secondary" type="button">Odebrat</button></div>'}function renderPreview(){var b=$('rows');b.innerHTML=draft.map(rowHtml).join('');[].slice.call(b.querySelectorAll('.row')).forEach(function(r){var i=Number(r.dataset.i);r.querySelector('button').onclick=function(){draft.splice(i,1);renderPreview()};r.querySelector('.date').onchange=function(){draft[i].date=this.value};r.querySelector('.shift').onchange=function(){draft[i].shift=this.value}});$('preview').classList.toggle('hidden',!draft.length)}async function loadSaved(){var d=await api('/api/v1/work'),b=$('saved');b.innerHTML='';if(!d.shifts.length){b.innerHTML='<span class="muted">Zatím žádné směny.</span>';return}d.shifts.forEach(function(x){var e=document.createElement('span');e.className='chip';e.textContent=new Date(x.work_date+'T12:00:00').toLocaleDateString('cs-CZ')+' · '+(x.shift==='dopoledni'?'dopolední':'odpolední');b.appendChild(e)})}$('file').onchange=function(){scanFile(this.files[0])};
document.addEventListener('paste',function(e){
  var items=e.clipboardData&&e.clipboardData.items?Array.from(e.clipboardData.items):[];
  var imageItem=items.find(function(item){return item.kind==='file'&&String(item.type||'').indexOf('image/')===0});
  if(!imageItem)return;
  var blob=imageItem.getAsFile();
  if(!blob)return;
  e.preventDefault();
  var ext=(blob.type.split('/')[1]||'png').replace('jpeg','jpg');
  var file=new File([blob],'screenshot-schichty.'+ext,{type:blob.type||'image/png'});
  scanFile(file);
});
$('save').onclick=async function(){var d=await api('/api/v1/work/commit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shifts:draft})});$('status').textContent='Uloženo '+d.added+' nových směn.';draft=[];renderPreview();loadSaved()};loadSaved();</script></body></html>
