<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Přehledy · Haneva</title>
<style>body{margin:0;font-family:Inter,system-ui;background:#f6f7fb;color:#172033}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:22px 0 50px}.top{display:flex;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:850}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#111827;color:#fff;box-shadow:0 10px 24px rgba(17,24,39,.18)}.back{color:inherit;text-decoration:none;font-weight:850}.back{font-size:13px;color:#667085}h1{font-size:clamp(42px,8vw,68px);margin:0 0 8px;letter-spacing:-.05em}.lead{color:#707887}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 14px 38px rgba(31,41,55,.07)}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7b8492;font-weight:850}.big{font-size:34px;font-weight:900;letter-spacing:-.04em;margin-top:8px}.note{font-size:12px;color:#7b8492;margin-top:6px}.wide{grid-column:1/-1}.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:180px;margin-top:14px}.bar{background:#dbeafe;border-radius:7px 7px 3px 3px;min-height:4px;position:relative}.bar span{position:absolute;bottom:-20px;width:100%;text-align:center;font-size:9px;color:#7b8492}.alert{margin-top:10px;padding:10px 12px;background:#fff7ed;border-radius:12px;color:#9a3412;font-size:13px;font-weight:750}.empty{color:#9299a5;padding:12px 0}@media(max-width:680px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.months{height:150px;gap:4px}}</style></head>
<body><main class="wrap"><div class="top"><a class="brand" href="/" aria-label="Haneva domů"><span class="brand-mark">H</span><span>Haneva</span></a><a class="back" href="/rozpocet/">← Rozpočet</a></div><h1>Přehledy</h1><p class="lead">Predikce konce měsíce, neobvyklé výdaje, týdenní souhrn a roční pohled.</p><section class="grid"><article class="card"><div class="kicker">Odhad konce měsíce</div><div class="big" id="projection">—</div><div class="note" id="projectionNote">Načítám…</div></article><article class="card"><div class="kicker">Společný účet</div><div class="big" id="balance">—</div><div class="note">Aktuální zůstatek z Rozpočtu</div></article><article class="card"><div class="kicker">Týdenní souhrn účtenek</div><div class="big" id="week">—</div><div class="note" id="weekNote"></div></article><article class="card"><div class="kicker">Neobvyklé</div><div id="anomaly" class="empty">Bez výrazné odchylky.</div></article><article class="card wide"><div class="kicker">Roční přehled výdajů</div><div class="months" id="months"></div></article></section></main>
<script>function money(v){return v==null?'—':new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',maximumFractionDigits:0}).format(v)}async function load(){var r=await fetch('/api/v1/insights',{cache:'no-store'}),d=await r.json();document.getElementById('projection').textContent=money(d.projection);document.getElementById('projectionNote').textContent=d.projection==null?'Rozpočet zatím neposkytl měsíční řadu pro predikci.':'Při současném tempu utrácení';document.getElementById('balance').textContent=money(d.shared_balance);document.getElementById('week').textContent=money(d.weekly&&d.weekly.receipt_total);document.getElementById('weekNote').textContent=(d.weekly?d.weekly.receipts:0)+' účtenek · '+(d.weekly?d.weekly.products:0)+' položek';if(d.anomaly){var a=document.getElementById('anomaly');a.className='alert';a.textContent=d.anomaly.message}var rows=d.months||[],max=Math.max.apply(null,rows.map(function(x){return x.expenses}).concat([1])),box=document.getElementById('months');box.innerHTML='';for(var m=1;m<=12;m++){var row=rows.find(function(x){return x.month===m}),bar=document.createElement('div');bar.className='bar';bar.style.height=((row?row.expenses:0)/max*100)+'%';bar.title=row?money(row.expenses):'';bar.innerHTML='<span>'+m+'</span>';box.appendChild(bar)}}load();</script></body></html>
